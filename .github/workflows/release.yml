# Builds the plugin and publishes a GitHub release with the installable archive
# whenever a vX.Y.Z tag is pushed. The release notes are the message of an
# annotated tag (git tag -a v1.2.3 -m "..."), or generated by GitHub if the
# tag has none, followed by installation instructions.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Package -Version $env:TAG.TrimStart('v')

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          README_URL: ${{ github.server_url }}/${{ github.repository }}#readme
        run: |
          $version = $env:TAG.TrimStart('v')
          # actions/checkout keeps only the commit; fetch the tag object for its message.
          git fetch --force origin "refs/tags/$($env:TAG):refs/tags/$($env:TAG)"
          $annotated = (git cat-file -t $env:TAG) -eq 'tag'
          $message = if ($annotated) { (git tag -l --format='%(contents)' $env:TAG | Out-String).Trim() } else { '' }

          $install = "**Installation:** open ``totalcmd-git-$version.zip`` in Total Commander, confirm the " +
                     "installation, answer Yes when the plugin offers to add the autoload color filter, and " +
                     "restart TC. See the [README]($env:README_URL) for details and caveats."
          $releaseArgs = @("out/totalcmd-git-$version.zip", '--title', "totalcmd-git $version", '--verify-tag')
          if ($message) {
              Set-Content notes.md "$message`n`n$install" -Encoding utf8
          } else {
              Set-Content notes.md $install -Encoding utf8
              $releaseArgs += '--generate-notes'
          }
          gh release create $env:TAG @releaseArgs --notes-file notes.md
